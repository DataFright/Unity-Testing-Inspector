name: Tests

# Push-only, deliberately: only someone with write access to this repo can push to main, so an
# outside contributor's pull request can never cause this workflow to run with access to the
# UNITY_EMAIL/UNITY_PASSWORD secrets below, regardless of GitHub's fork-PR approval settings.
# See docs/DESIGN.md Sec 12 for the full reasoning (a prior game-ci + offline-license-file
# approach was scrapped after finding the license file itself is machine-bound, and the realistic
# alternative - live login each run - means real account credentials as secrets, which a
# pull_request trigger would expose to more surface area than necessary).
on:
  push:
    branches: [ main ]

jobs:
  editmode-tests:
    name: EditMode tests
    # Windows, not Ubuntu: buildalon/unity-setup has an open, unresolved bug on Ubuntu runners
    # (checks a hardcoded /opt/unityhub/unityhub path that newer Unity Hub .deb packages don't
    # use - https://github.com/buildalon/unity-setup/issues/57). This repo is public, so GitHub
    # gives unlimited free minutes on any OS - no cost tradeoff either way.
    runs-on: windows-latest
    # Round three, 2026-08-15: raised 25->60 again, temporarily, for this attempt's seed run only.
    # Round two's actual killer wasn't cache-restore corruption in the abstract - it was that the
    # ONLY cache entry that ever existed for this key was seeded by a run cut off by too tight a
    # timeout mid-install/mid-save ("run #15"), and actions/cache never overwrites an existing key,
    # so every later "re-enable caching" attempt (including both round-two runs) restored that same
    # original, possibly-incomplete entry rather than ever getting a genuine clean reseed. This
    # round: the stale cache entry was deleted by hand first, so this run seeds a real new one - the
    # 60min headroom is so a fresh ~13-14min install + its cache-save post-step can't get cut off
    # the same way again. Right-size back down to ~20-25 once a cache-hit run is confirmed green
    # (see git history/DESIGN.md Sec 12 for the outcome).
    timeout-minutes: 60
    steps:
      - name: Checkout UTI
        uses: actions/checkout@v4

      # cache-installation: ON again, round three, 2026-08-15 - re-enabling it twice before (round
      # two: runs #16/#17) both got a cache hit that then failed to actually run Unity, in two
      # different ways, from what should've been identical cached bytes under one unchanged key.
      # Real reasoning for trying again rather than leaving this off for good: actions/cache never
      # overwrites an existing key - it silently no-ops the save if one's already there - and the
      # ONLY entry that ever existed for this key was seeded by a run cut off by the job timeout
      # mid-install/mid-save ("run #15"). Every later restore, including both round-two runs, was
      # very possibly restoring that same original incomplete entry, never a genuinely clean one.
      # This attempt: the stale entry was deleted by hand first (GitHub gives no other way to force
      # a reseed under this action's own opaque key - it doesn't expose a custom-key input), and
      # timeout-minutes is raised to 60 for this run specifically so a full fresh install + its
      # cache-save post-step has real headroom, unlike the run that poisoned the original entry.
      # If a second, cache-hit run afterward comes back fast AND actually runs Unity successfully,
      # that confirms the poisoned-key theory and this stays on. If it fails again under these
      # cleaner conditions, that rules the theory out and points at something structural to
      # Windows-runner + actions/cache + a payload this size (buildalon/unity-setup's own issue
      # tracker has other unresolved cache-triggered reports - #12, #55) - see docs/DESIGN.md Sec 12
      # and docs/DESIGN_HISTORY.md's "round three" section for the confirmed outcome either way.
      #
      # Seed run (run #21, this commit) confirmed clean and uncancelled: Install Unity 14m59s
      # (normal fresh-install cost), Post Install Unity (the actual cache-save) 6m34s, both green -
      # unlike the run that poisoned the original entry, this one wasn't cut off. This commit exists
      # to trigger the actual test: a second run restoring from this fresh entry.
      #
      # modules: None stays regardless of this round's outcome - not implicated in any prior
      # failure, and a real win on its own (less downloaded/installed, never needed for this job).
      - name: Install Unity
        uses: buildalon/unity-setup@v2
        with:
          unity-version: 6000.5.6f1
          modules: None
          cache-installation: true

      # Live login each run, correctly bound to this runner's HardwareId - not a pre-generated
      # license file. A license file exported from any one machine (including a maintainer's own
      # dev machine) is bound to that machine and will not validate here - confirmed the hard way
      # before this workflow was written this way. See docs/DESIGN.md Sec 12.
      - name: Activate Unity Personal license
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      # CI~ is a minimal, scrubbed project shell (no scenes, no game content —
      # see CI~/README.md) that exists solely so Unity's Test Runner has a real
      # project to resolve UTI's own EditMode tests (TESTS/EditMode/) from.
      #
      # -logFile CI~/unity.log, not "-logFile -": found live 2026-08-08 (see DESIGN.md Sec 12) -
      # Windows applications don't have a real stdout handle by default, so "-logFile -" (which
      # streams to stdout fine on Mac/Linux) can silently hang the whole process on Windows
      # instead of just failing to show output. A real file path avoids that entirely.
      #
      # Launches Unity directly instead of via buildalon/unity-action, kept deliberately rather
      # than reverted now that CI is green again (run #18) - this is a considered choice, not
      # leftover debugging code. It's what actually diagnosed the cache-restore problem above: run
      # #16 hung 55+ min with zero signal through the plain wrapper (which has no internal timeout
      # of its own - it spawns Unity with all stdio ignored and just awaits process close, so a
      # real hang and a slow-but-working run look identical to it); this same script caught run
      # #17's real failure in ~20 seconds with a specific, actionable error. Its exit-code handling
      # is equivalent to the wrapper's own (`exit $proc.ExitCode` here vs. `resolve(code === null ?
      # 1 : code)` in @rage-against-the-pixel/unity-cli's spawn callback) - confirmed by reading
      # unity-cli's source, so there's no correctness tradeoff to reverting for. Revisit only if
      # this becomes a maintenance burden.
      #
      # Polls every 20s while Unity runs: process alive/CPU/Windows "Responding" state,
      # unity.log's existence and growth, any WerFault.exe (Windows' crash-dialog process - would
      # explain a silent hang if Unity crashed natively and is blocked on a dialog nothing in
      # headless CI can dismiss), child processes, and a fallback check of Unity's default
      # Editor.log location in case -logFile isn't landing where expected. Inner max wait is 11
      # min, under this step's own 15-min timeout-minutes, so there's room to print a full
      # diagnostic dump and let it upload before GitHub force-kills the step if it ever hangs again.
      - name: Run EditMode test suite (with diagnostics)
        timeout-minutes: 15
        shell: pwsh
        run: |
          $unityExe = "C:\Program Files\Unity\Hub\Editor\6000.5.6f1\Editor\Unity.exe"
          $logFile = "CI~/unity.log"
          $resultsFile = "CI~/EditMode-results.xml"
          $unityArgs = @(
            "-projectPath", "CI~",
            "-runTests", "-batchmode", "-nographics",
            "-testPlatform", "EditMode",
            "-testResults", $resultsFile,
            "-logFile", $logFile
          )

          Write-Host "Launching: $unityExe $($unityArgs -join ' ')"
          $proc = Start-Process -FilePath $unityExe -ArgumentList $unityArgs -PassThru -NoNewWindow

          $maxWaitSeconds = 660
          $pollInterval = 20
          $elapsed = 0

          while (-not $proc.HasExited -and $elapsed -lt $maxWaitSeconds) {
            Start-Sleep -Seconds $pollInterval
            $elapsed += $pollInterval
            $proc.Refresh()

            $logExists = Test-Path $logFile
            $logSize = if ($logExists) { (Get-Item $logFile).Length } else { 0 }
            $cpuTime = try { $proc.TotalProcessorTime } catch { "?" }
            $responding = try { $proc.Responding } catch { "?" }

            Write-Host "[+${elapsed}s] PID=$($proc.Id) exited=$($proc.HasExited) responding=$responding cpu=$cpuTime logExists=$logExists logSizeBytes=$logSize"

            $wer = Get-Process -Name WerFault -ErrorAction SilentlyContinue
            if ($wer) {
              Write-Host "  !! WerFault.exe detected (PID $($wer.Id -join ',')) - Unity likely crashed natively and is blocked on an interactive error dialog"
            }

            $children = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($proc.Id)" -ErrorAction SilentlyContinue
            if ($children) {
              Write-Host "  children: $(($children | ForEach-Object { "$($_.ProcessId):$($_.Name)" }) -join ', ')"
            }
          }

          if (-not $proc.HasExited) {
            Write-Host "=== TIMED OUT after ${elapsed}s - Unity did not exit. Dumping diagnostics. ==="
            Write-Host "--- Unity/related processes ---"
            Get-Process | Where-Object { $_.ProcessName -match "Unity|WerFault|dotnet|VBCSCompiler" } |
              Format-Table Id, ProcessName, Responding, CPU, WorkingSet -AutoSize | Out-String | Write-Host

            if (Test-Path $logFile) {
              Write-Host "--- $logFile (partial) ---"
              Get-Content $logFile | Write-Host
            } else {
              Write-Host "$logFile still does not exist after ${elapsed}s"
            }

            $altLog = "$env:LOCALAPPDATA\Unity\Editor\Editor.log"
            if (Test-Path $altLog) {
              Write-Host "--- fallback Editor.log found at $altLog (Unity may be logging here instead) ---"
              Get-Content $altLog -Tail 200 | Write-Host
            }

            Write-Host "=== killing PID $($proc.Id) ==="
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }

          Write-Host "Unity exited after ${elapsed}s with code $($proc.ExitCode)"
          if (Test-Path $logFile) {
            Write-Host "--- last 100 lines of $logFile ---"
            Get-Content $logFile -Tail 100 | Write-Host
          }
          exit $proc.ExitCode

      - name: Print Unity log
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "CI~/unity.log") {
            Get-Content "CI~/unity.log"
          } else {
            Write-Host "No CI~/unity.log found - Unity may not have started."
          }

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EditMode-test-results
          path: |
            CI~/EditMode-results.xml
            CI~/unity.log
