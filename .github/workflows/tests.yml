name: Tests

# Push-only, deliberately: only someone with write access to this repo can push to main, so an
# outside contributor's pull request can never cause this workflow to run with access to the
# UNITY_EMAIL/UNITY_PASSWORD secrets below, regardless of GitHub's fork-PR approval settings.
# See docs/DESIGN.md Sec 12 for the full reasoning (a prior game-ci + offline-license-file
# approach was scrapped after finding the license file itself is machine-bound, and the realistic
# alternative - live login each run - means real account credentials as secrets, which a
# pull_request trigger would expose to more surface area than necessary).
on:
  push:
    branches: [ main ]

jobs:
  editmode-tests:
    name: EditMode tests
    # Windows, not Ubuntu: buildalon/unity-setup has an open, unresolved bug on Ubuntu runners
    # (checks a hardcoded /opt/unityhub/unityhub path that newer Unity Hub .deb packages don't
    # use - https://github.com/buildalon/unity-setup/issues/57). This repo is public, so GitHub
    # gives unlimited free minutes on any OS - no cost tradeoff either way.
    runs-on: windows-latest
    # Raised from 30 to 60 on 2026-08-11, deliberately. This cap still exists to catch a genuine
    # hang (found live 2026-08-08 - see DESIGN.md Sec 12) rather than silently occupying a runner
    # for hours, but 30 was too tight for one specific thing: @actions/cache's saveCache() runs in
    # the POST-job phase, which a job-level timeout also covers. The first (cache-seeding) run has
    # to install Unity AND compress/upload it, and 30 minutes killed that save mid-write - which is
    # what made caching look permanently broken. See the "Install Unity" step below.
    # Only the seeding run needs this headroom; a cache-hit run finishes in a fraction of it, since
    # timeout-minutes is a cap, not a reservation.
    timeout-minutes: 60
    steps:
      - name: Checkout UTI
        uses: actions/checkout@v4

      # cache-installation: re-enabled 2026-08-11 (see git history at 243070b for that reasoning -
      # the 2026-08-09 revert rested on a real misdiagnosis: "modules: None" does exist, and the
      # job timeout, not caching itself, killed the original cache-save). That fix was real and
      # partly confirmed: run #16 AND run #17 both got genuine cache hits on "Install Unity" (4m8s,
      # 4m12s - matching the ~4-7 min estimate). But BOTH of those cache-restored installs then
      # failed to actually run Unity, in two DIFFERENT ways: #16 hung 55+ min with zero log output,
      # #17 crashed in seconds with "Unity.dll failed to load" (exit -2147024770 =
      # ERROR_MOD_NOT_FOUND). Every fresh (non-cached) install in this project's history has always
      # worked. Disabled again pending investigation into why the cache-restored install is
      # producing two different broken states from what should be the same cached bytes - see
      # docs/HANDOFF.md for the full writeup and next-step reasoning.
      #
      # modules: None is NOT implicated and stays on its own merit - it's an install-time/size
      # optimization only (IL2CPP is a build-target/scripting-backend module for Player builds;
      # there's no real mechanism for its absence to break the base Editor launching for EditMode
      # tests), confirmed real and working via unity-setup's own source (see git history at
      # 243070b). The two different symptoms from what should be one deterministic cached blob
      # points at something non-deterministic in the restore/extraction itself, not a
      # deterministic "the Editor needs this module" problem.
      - name: Install Unity
        uses: buildalon/unity-setup@v2
        with:
          unity-version: 6000.5.6f1
          modules: None
          cache-installation: false

      # Live login each run, correctly bound to this runner's HardwareId - not a pre-generated
      # license file. A license file exported from any one machine (including a maintainer's own
      # dev machine) is bound to that machine and will not validate here - confirmed the hard way
      # before this workflow was written this way. See docs/DESIGN.md Sec 12.
      - name: Activate Unity Personal license
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      # CI~ is a minimal, scrubbed project shell (no scenes, no game content —
      # see CI~/README.md) that exists solely so Unity's Test Runner has a real
      # project to resolve UTI's own EditMode tests (TESTS/EditMode/) from.
      #
      # -logFile CI~/unity.log, not "-logFile -": found live 2026-08-08 (see DESIGN.md Sec 12) -
      # Windows applications don't have a real stdout handle by default, so "-logFile -" (which
      # streams to stdout fine on Mac/Linux) can silently hang the whole process on Windows
      # instead of just failing to show output. A real file path avoids that entirely.
      #
      # TEMPORARY DIAGNOSTIC STEP, 2026-08-14 - replaces buildalon/unity-action for this run only.
      # Run #16 hung here for 55+ minutes with zero log output; the wrapper
      # (@rage-against-the-pixel/unity-cli) spawns Unity with all stdio ignored and no internal
      # timeout of its own, so it can't tell a real hang from a slow-but-working run - see
      # docs/HANDOFF.md for the full investigation so far. This launches Unity directly instead, so
      # this step can poll it while it runs (process alive/CPU/Windows "Responding" state,
      # unity.log's existence and growth, WerFault.exe - Windows' crash-dialog process, which would
      # explain a silent hang if Unity crashed natively and is blocked on a dialog nothing in
      # headless CI can dismiss - and any child processes). Root cause not yet confirmed; two new
      # variables landed in the same run (modules: None, and a cache-restored rather than
      # freshly-installed Editor). Once root-caused, revert to the plain buildalon/unity-action step
      # (preserved in git history at commit 243070b) rather than keeping this permanently - it
      # duplicates argument-building/exit-code handling the wrapper already does correctly.
      #
      # Inner max wait is 11 min, under this step's own 15-min timeout-minutes, so there's room to
      # print the full diagnostic dump and let it upload before GitHub force-kills the step.
      - name: Run EditMode test suite (with diagnostics)
        timeout-minutes: 15
        shell: pwsh
        run: |
          $unityExe = "C:\Program Files\Unity\Hub\Editor\6000.5.6f1\Editor\Unity.exe"
          $logFile = "CI~/unity.log"
          $resultsFile = "CI~/EditMode-results.xml"
          $unityArgs = @(
            "-projectPath", "CI~",
            "-runTests", "-batchmode", "-nographics",
            "-testPlatform", "EditMode",
            "-testResults", $resultsFile,
            "-logFile", $logFile
          )

          Write-Host "Launching: $unityExe $($unityArgs -join ' ')"
          $proc = Start-Process -FilePath $unityExe -ArgumentList $unityArgs -PassThru -NoNewWindow

          $maxWaitSeconds = 660
          $pollInterval = 20
          $elapsed = 0

          while (-not $proc.HasExited -and $elapsed -lt $maxWaitSeconds) {
            Start-Sleep -Seconds $pollInterval
            $elapsed += $pollInterval
            $proc.Refresh()

            $logExists = Test-Path $logFile
            $logSize = if ($logExists) { (Get-Item $logFile).Length } else { 0 }
            $cpuTime = try { $proc.TotalProcessorTime } catch { "?" }
            $responding = try { $proc.Responding } catch { "?" }

            Write-Host "[+${elapsed}s] PID=$($proc.Id) exited=$($proc.HasExited) responding=$responding cpu=$cpuTime logExists=$logExists logSizeBytes=$logSize"

            $wer = Get-Process -Name WerFault -ErrorAction SilentlyContinue
            if ($wer) {
              Write-Host "  !! WerFault.exe detected (PID $($wer.Id -join ',')) - Unity likely crashed natively and is blocked on an interactive error dialog"
            }

            $children = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($proc.Id)" -ErrorAction SilentlyContinue
            if ($children) {
              Write-Host "  children: $(($children | ForEach-Object { "$($_.ProcessId):$($_.Name)" }) -join ', ')"
            }
          }

          if (-not $proc.HasExited) {
            Write-Host "=== TIMED OUT after ${elapsed}s - Unity did not exit. Dumping diagnostics. ==="
            Write-Host "--- Unity/related processes ---"
            Get-Process | Where-Object { $_.ProcessName -match "Unity|WerFault|dotnet|VBCSCompiler" } |
              Format-Table Id, ProcessName, Responding, CPU, WorkingSet -AutoSize | Out-String | Write-Host

            if (Test-Path $logFile) {
              Write-Host "--- $logFile (partial) ---"
              Get-Content $logFile | Write-Host
            } else {
              Write-Host "$logFile still does not exist after ${elapsed}s"
            }

            $altLog = "$env:LOCALAPPDATA\Unity\Editor\Editor.log"
            if (Test-Path $altLog) {
              Write-Host "--- fallback Editor.log found at $altLog (Unity may be logging here instead) ---"
              Get-Content $altLog -Tail 200 | Write-Host
            }

            Write-Host "=== killing PID $($proc.Id) ==="
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }

          Write-Host "Unity exited after ${elapsed}s with code $($proc.ExitCode)"
          if (Test-Path $logFile) {
            Write-Host "--- last 100 lines of $logFile ---"
            Get-Content $logFile -Tail 100 | Write-Host
          }
          exit $proc.ExitCode

      - name: Print Unity log
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "CI~/unity.log") {
            Get-Content "CI~/unity.log"
          } else {
            Write-Host "No CI~/unity.log found - Unity may not have started."
          }

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EditMode-test-results
          path: |
            CI~/EditMode-results.xml
            CI~/unity.log
